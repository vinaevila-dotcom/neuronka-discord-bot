services:
  - type: worker
    name: neuronka-discord-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: AI_API_URL
        value: https://text.pollinations.ai/openai
      - key: AI_MODEL
        value: openai-fast
